plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antrenmanim.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.antrenmanim.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kolay kurulum için release sürümü de debug anahtarıyla imzalanır
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
