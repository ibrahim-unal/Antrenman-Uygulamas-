name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Antrenmanim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Antrenmanim-apk
          path: Antrenmanim.apk

      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Antrenmanım v1.0.${{ github.run_number }}
          body: Telefonuna indirip kur. (Bilinmeyen kaynaklardan yükleme izni isteyebilir.)
          files: Antrenmanim.apk
          make_latest: true
